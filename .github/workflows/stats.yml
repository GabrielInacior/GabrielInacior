name: refresh stats cards

# Regenerates the custom noir-neon stat SVGs. Works with the default token
# (public numbers). To also count PRIVATE contributions, add a classic PAT
# with scope read:user as the secret GH_PAT — the step picks it up and the
# numbers include private commits. Without it, the committed cards just stay
# as they are (safe no-op).

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: generate stat cards
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python .github/scripts/gen_stats.py
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/svg/stats_card.svg assets/svg/stats_langs.svg
          git commit -m "chore: refresh stat cards" || echo "no changes"
          git push
